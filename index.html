<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay productive and organized</p>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">➕ Add</button>
            </div>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total Tasks:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="completedCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value" id="remainingCount">0</span>
            </div>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <div class="empty-state" id="emptyState">
            <p>🎯 No tasks yet. Add one to get started!</p>
        </div>

        <div class="action-buttons">
            <button id="clearCompletedBtn" class="action-btn clear-btn">🗑️ Clear Completed</button>
            <button id="clearAllBtn" class="action-btn danger-btn">⚠️ Clear All</button>
        </div>
    </div>

    <footer class="footer">
        <p>Built with ❤️ | Data saved in local storage</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
